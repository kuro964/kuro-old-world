
- type: entity
  id: FloorChasmDeco
  name: Heat Chasm
  description: You can't even see the bottom. Heat rushes from below.
  placement:
    mode: SnapgridCenter
    snap:
      - Wall
  components:
    - type: Transform
      anchored: true
    - type: Clickable
    - type: Sprite
      sprite: _Stalker_OW/Objects/Decoration/chasm_deco.rsi
      drawdepth: BelowFloor
      layers:
        - state: chasm
    - type: Icon
      sprite: _Stalker_OW/Objects/Decoration/chasm_deco.rsi
      state: full
    - type: IconSmooth
      key: chasm
      additionalKeys:
        - walls
      base: chasm
    - type: Physics
    - type: Physics
      bodyType: Static
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          mask:
            - FullTileMask
          layer:
            - WallLayer
          density: 1000
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          layer:
            - WallLayer
          mask:
            - ItemMask
          density: 1000
          hard: false
    - type: Tag
      tags:
        - HideContextMenu
        - Wall