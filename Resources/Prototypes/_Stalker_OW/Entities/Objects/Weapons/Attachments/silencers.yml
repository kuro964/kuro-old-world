# Rifles

- type: entity
  parent: STBaseModuleSilencerRifles
  id: STOWModuleSilencerRiflesT4Ru
  name: Advanced Warsaw rifle silencer
  suffix: STOW, silencer, T4, RU
  components:
    - type: Tag
      tags:
        - STWeaponModuleRifleSilencerRu
    - type: STWeaponModule
      effect:
        soundGunshotVolumeAddition: -10
        farshotSoundDecrease: 0.3 # OW, 0.6 - 0.3
    - type: Sprite
      state: silencer_T2_ru
    - type: Icon
      state: silencer_T2_ru

