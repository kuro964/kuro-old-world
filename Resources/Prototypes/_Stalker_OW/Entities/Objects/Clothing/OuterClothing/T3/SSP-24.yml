# Base
- type: entity
  parent: STClothingOuterArmorStorageBasic
  id: STOWClothingOuterArmorSSP24Base
  name: SSP-24 # base
  abstract: true
  suffix: STOW, T3, Env
  components:
    - type: STWeight
      self: 7
    - type: PullDoAfter
      pullTime: 6
    - type: Craftable
    - type: Sprite
      sprite: _Stalker/Objects/Clothing/outerClothing/ssp24.rsi
    - type: Clothing
      sprite: _Stalker/Objects/Clothing/outerClothing/ssp24.rsi
    - type: ToggleableClothing
      clothingPrototype: STOWClothingHeadHelmetSSP24Base
    - type: Storage
      maxItemSize: Huge
      blacklist:
        tags:
          - STArtifact
      grid:
        - 0,0,5,3
        - 7,0,10,3
        - 12,0,17,3
    - type: Armor
      armorClass: 2
      modifiers:
        flatReductions:
          Blunt: 5
          Slash: 2
          Piercing: 1
          Heat: 4
          Radiation: 3
          Caustic: 4
          Shock: 4
        coefficients:
          Blunt: 0.8
          Slash: 0.9
          Piercing: 0.8
          Heat: 0.50
          Radiation: 0.6
          Caustic: 0.50
          Shock: 0.60
          Compression: 0.7
    - type: GrantsArtifactSlots
      slots: 5 # EN
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95
    - type: Tag
      tags:
        - BlockBack
        - BlockBelt
    - type: Item
      size: Ginormous
    - type: ContainerContainer
      containers:
        toggleable-clothing: !type:ContainerSlot {}
        storagebase: !type:Container
          ents: []

- type: entity
  parent: ClothingHeadHardsuitBase
  id: STOWClothingHeadHelmetSSP24Base
  name: green 'Ecologist' helmet
  description: It protects against anomalies and radiation, but definitely not bullets.
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
    - type: Armor
      armorClass: 2
      modifiers:
        flatReductions:
          Radiation: 5
          Caustic: 1
          Psy: 1
        coefficients:
          Blunt: 0.95
          Slash: 0.95
          Piercing: 0.95
          Compression: 0.95
          Psy: 0.7
    - type: Sprite
      sprite: _Stalker/Objects/Clothing/hats/ssp24_helm.rsi
    - type: Clothing
      sprite: _Stalker/Objects/Clothing/hats/ssp24_helm.rsi
    - type: IdentityBlocker
    - type: IngestionBlocker
    - type: PressureProtection
      highPressureMultiplier: 0.1
      lowPressureMultiplier: 1000
    - type: HideLayerClothing
      slots:
        - Hair
        - HeadTop
