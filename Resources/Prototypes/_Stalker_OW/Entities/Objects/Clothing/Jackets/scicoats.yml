- type: entity
  parent: [STClothingCapeBase, ClothingOuterStorageFoldableBase]
  id: STOWClothingOuterCoatLabChem
  name: Chemist's Lab Coat
  description: A jacket designed to fit over SSPs. Chemist variant to denote specialties in the Institute.
  suffix: STOW, T3  
  components:
    - type: Sprite
      sprite: _Stalker_OW/Objects/Clothing/Coats/labcoatchem.rsi
    - type: Clothing
      sprite: _Stalker_OW/Objects/Clothing/Coats/labcoatchem.rsi
    - type: Storage
      maxItemSize: Normal
      blacklist:
        tags:
          - STArtifact
      grid:
        - 0,4,0,5
        - 0,0,0,2
        - 2,4,2,5
        - 2,1,3,2
        - 4,4,4,5
        - 5,1,6,2
        - 6,4,6,5
        - 8,4,8,5
        - 8,0,8,2
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface

- type: entity
  parent: [ClothingOuterStorageFoldableBaseOpened, STOWClothingOuterCoatLabChem]
  id: STOWClothingOuterCoatLabChemOpened
  name: Chemist Lab Coat

