- type: entity
  parent: ClothingOuterCoatLoyalist
  id: STOWCloakMonolith
  name: Officer's Cloak
  suffix: STOW, Monolith
  description: A cloak usually worn by officers and elites of Monolith
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Clothing/cloak/coat_tihiy.rsi
    - type: Clothing
      sprite: _Stalker/Objects/Clothing/cloak/coat_tihiy.rsi
    - type: ToggleableClothing
      clothingPrototype: STClothingHeadHelmetTihiy
    - type: Craftable
    - type: PersonalDamage
      damage:
        types:
          Radiation: 40

- type: entity
  parent: STClothingHeadHatBase
  id: STOWCloakHeadMonolith
  name: Officer's Hood
  description: A cloak usually worn by officers and elites of Monolith
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Clothing/hats/coat_hat_tihiy.rsi
    - type: Clothing
      sprite: _Stalker/Objects/Clothing/hats/coat_hat_tihiy.rsi
    - type: HideLayerClothing
      slots:
        - HeadTop
  
