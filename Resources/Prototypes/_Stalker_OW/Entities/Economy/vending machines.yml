  suffix: ST
  components:
    - type: AccessReader
      access: [["Bandit"]]
    - type: VendingMachine
      ejectDelay: 0.1
      pack: BanditInventorySTNW #EN
      dispenseOnHitChance: 0.0
      dispenseOnHitThreshold: 2
      offState: off
      brokenState: broken
      autoEquipDispensed: true #ST:OW
      prefillMagazines: false #ST:OW
 
