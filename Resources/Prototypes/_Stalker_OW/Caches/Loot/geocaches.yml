# ST:OW - Patch for geocaching occasionally producing no loot
- type: entity
  parent: BaseItem
  id: longrangemetaldetectorBox
  name: Коробка из тайника
  description: Ящик из тайника
  components:
    - type: Item
      size: Large
      shape:
        - 0,0,6,6
    - type: Sprite
      sprite: _Stalker/Structures/Furniture/carton_box.rsi
      state: kb2
    - type: Icon
      sprite: _Stalker/Structures/Furniture/carton_box.rsi
      state: kb2
    - type: SpawnItemsOnUse
      # Guaranteed reward: orGroup selects one entry to ensure at least SOMETHING always drops
      items:
        - { id: MedkitAI2, prob: 0.50, orGroup: GeocacheGuaranteed }
        - { id: Roubles500, prob: 0.50, orGroup: GeocacheGuaranteed }

        # Medical supplies
        - { id: MedkitMilitary, prob: 0.10 }

        # Weapons and explosives
        - { id: STWeaponShotgunAnomalyToz34, prob: 0.01 }
        - { id: STWeaponSMGVZ61, prob: 0.015 }
        - { id: STWeaponSMGMP40, prob: 0.02 }
        - { id: STWeaponSMGMP40ruust, prob: 0.01 }
        - { id: WeaponStalkerPistolTec9, prob: 0.02 }
        - { id: DG05SmokeGrenade, prob: 0.20 }
        - { id: RGD5Grenade, prob: 0.10 }

        # Artifacts and utility
        - { id: ZoneArtifactBattery, prob: 0.10 }
        - { id: ZoneArtifactKolobok, prob: 0.01 }
        - { id: ClothingBeltSmuggler, prob: 0.02 }

        # Jewelry
        - { id: SilverRingGem, prob: 0.015 }
        - { id: ClothingNeckBling, prob: 0.005 }
        - { id: WristwatchGold, prob: 0.001 }

        # Currency
        - { id: Roubles1000, prob: 0.20 }
        - { id: Roubles2000, prob: 0.05 }
      sound:
        path: /Audio/Effects/unwrap.ogg