- type: entity
  parent: NPCDoll
  id: NPCFreedomOW
  name: Fedir 'Kebab' [→   ←]
  suffix: ST, Freedom, OW, STOW
  description: Stepson of a stalker named 'Bilibob'. An experienced artifact hunter looking to get into mutant smuggling.
  components:
    - type: Sprite
      sprite: _Stalker/NPC/Groups/freedom.rsi
      state: icon
    - type: Physics
      bodyType: Static
    - type: DatasetVocalizer
      dataset: NPCStalkerTraderAds
    - type: ActivatableUI
      key: enum.ShopUiKey.Key
      singleUser: true
    - type: UserInterface
      interfaces:
        enum.ShopUiKey.Key:
          type: ShopBoundUserInterface
    - type: Shop
      moneyId: ArtifactShards
      shopPresetId: Freenium
    - type: TypingIndicator
      proto: robot
    - type: TTS # Corvax-TTS
      voice: TrainingRobot
    - type: Speech
      speechVerb: Robotic
      speechSounds: Alto
    - type: IntrinsicRadioReceiver
    - type: IntrinsicRadioTransmitter
      channels:
        - Binary
    - type: ActiveRadio
      channels:
        - Binary
        - Common

