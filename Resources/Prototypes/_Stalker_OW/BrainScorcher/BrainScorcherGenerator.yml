          spawn:
            STCraftSheetAluminumT4:
              min: 0
              max: 2
            STCraftPlasticFittingT4:
              min: 0
              max: 2
            STCraftSheetBrassT3:
              min: 0
              max: 3
       
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
