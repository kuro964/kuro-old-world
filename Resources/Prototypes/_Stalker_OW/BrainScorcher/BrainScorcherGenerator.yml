- type: entity
  id: BrainScorcherGenerator
  parent: SubstationBasicEmpty
  name: Psy-Substation
  description: Looks important, I would probably destroy it if I were you. Perhaps don't stand too close either.
  suffix: Stalker, Brain Scorcher
  components:
    - type: BrainScorcherGenerator
    - type: Sprite
      sprite: _Stalker_OW/Objects/BrainScorcher/BS_Substation.rsi
      layers:
      - state: base
    - type: IntrinsicRadioTransmitter
      channels:
      - Monolith
    - type: Armor
      armorClass: 0
      modifiers:
        coefficients:
          Psy: 0.0
        
    - type: Explosive
      explosionType: Default
      maxIntensity: 200
      intensitySlope: 2
      totalIntensity: 100
      maxTileBreak: 0
      tileBreakScale: 0
    - type: Destructible
