# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootHiddenCacheT1
  table: !type:AllSelector
    children:
    # Crafting materials - T1
    - { id: STCraftBasicPCBT1, prob: 0.1, rolls: 2 }
    - { id: STCraftSheetCopperT1, prob: 0.1, rolls: 2 }
    - { id: STCraftPinePlankT1, prob: 0.1, rolls: 2 }
    - { id: STCraftPlasticFittingT1, prob: 0.1, rolls: 2 }
    - { id: STCraftGlassT1, prob: 0.1, rolls: 2 }
    - { id: STCraftCottonFabricT1, prob: 0.1, rolls: 2 }
    - { id: STCraftBasicThreadKitT1, prob: 0.1, rolls: 2 }

    # Crafting materials - T2
    - { id: STCraftStandardPCBT2, prob: 0.1 }
    - { id: STCraftSheetIronT2, prob: 0.1 }
    - { id: STCraftBirchPlankT2, prob: 0.1 }
    - { id: STCraftPlasticFittingT2, prob: 0.1 }
    - { id: STCraftGlassT2, prob: 0.1 }
    - { id: STCraftHideT2, prob: 0.1 }
    - { id: STCraftTapeKitT2, prob: 0.1 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.04 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.2, rolls: 3 }
    - { id: STGauze, prob: 0.2, rolls: 3 }
    - { id: STOintment, prob: 0.2, rolls: 3 }
    - { id: STTourniquet, prob: 0.05 }
    - { id: antiradpill, prob: 0.05 }
    - { id: radioprotectpill, prob: 0.05 }
    - { id: psyblock, prob: 0.05 }
    - { id: MedkitAI2, prob: 0.08 }
    - { id: MedkitMilitary, prob: 0.03 }
    - { id: MedkitScience, prob: 0.01 }

    # Utility equipment
    - { id: GeigerCounter, prob: 0.02 }
    - { id: BaseRadio, prob: 0.02 }
    - { id: HandheldGPSBasic, prob: 0.02 }
    - { id: BoxArtcontDamaged, prob: 0.015 }
    - { id: STFlashlightSeclite, prob: 0.02 }
    - { id: STHeadLight, prob: 0.02 }
    - { id: PowerCellHyper, prob: 0.05 }
    - { id: CheapLighter, prob: 0.03 }
    - { id: Matchbox, prob: 0.03 }
    - { id: CigPackMarlboro, prob: 0.02 }
    - { id: CigPackSuka, prob: 0.02 }
    - { id: CigPackKosmos, prob: 0.02 }
    - { id: CraftLeatherbox, prob: 0.005 }

    # Jewelry - 3% per container
    - !type:NestedSelector
      tableId: STLootJewelry
      prob: 0.03

- type: entity
  id: STHiddenCacheStorageFillT1
  abstract: true
  suffix: ST, Cache, T1
  components:
    - type: EntityTableContainerFill # ST:OW
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootHiddenCacheT1

