# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootTrashT3
  table: !type:AllSelector
    children:
    # Crafting materials - T3
    - { id: STCraftMultilayerPCBT3, prob: 0.1 }
    - { id: STCraftSheetBrassT3, prob: 0.1 }
    - { id: STCraftOakPlankT3, prob: 0.1 }
    - { id: STCraftPlasticFittingT3, prob: 0.1 }
    - { id: STCraftQuartzCrystalT3, prob: 0.1 }
    - { id: STCraftSturdyHideT3, prob: 0.1 }
    - { id: STCraftGlueKitT3, prob: 0.1 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.03 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.3, rolls: 3 }
    - { id: STGauze, prob: 0.3, rolls: 3 }
    - { id: STOintment, prob: 0.3, rolls: 3 }
    - { id: STTourniquet, prob: 0.06 }
    - { id: antiradpill, prob: 0.06 }
    - { id: radioprotectpill, prob: 0.06 }
    - { id: psyblock, prob: 0.06 }
    - { id: MedkitAI2, prob: 0.09 }
    - { id: MedkitMilitary, prob: 0.03 }

    # Food and drink
    - { id: STDrinkJarMold, prob: 0.02 }
    - { id: STDrinkJarPiss, prob: 0.02 }
    - { id: STDrinkJarMilkSpoiled, prob: 0.02 }
    - { id: STDrinkJarSap, prob: 0.01 }
    - { id: STDrinkJar, prob: 0.01 }

    # Utility equipment
    - { id: GeigerCounter, prob: 0.03 }
    - { id: BaseRadio, prob: 0.03 }
    - { id: HandheldGPSBasic, prob: 0.03 }

    # Jewelry - 10% per container
    - !type:NestedSelector
      tableId: STLootJewelry
      prob: 0.10

- type: entity
  parent: STBaseTrashCache
  id: STTrashStorageFillT3
  name: мусор
  abstract: true
  suffix: ST, Cache, T3
  components:
    - type: Transform
      anchored: true
    - type: InteractionOutline # ST:OW
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootTrashT3

- type: entity
  parent: [STBaseTrashCache, STTrashStorageFillT3]
  id: STTrash1CacheT3
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Decoration/trash.yml
      state: 1
    - type: SpawnOnDespawn
      prototype: STTrash1CacheT3

