# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootTrashT5
  table: !type:AllSelector
    children:
    # Crafting materials - T4
    - { id: STCraftHighPerformanceChipT4, prob: 0.1, rolls: 2 }
    - { id: STCraftSheetAluminumT4, prob: 0.1, rolls: 2 }
    - { id: STCraftYewPlankT4, prob: 0.1, rolls: 2 }
    - { id: STCraftPlasticFittingT4, prob: 0.1, rolls: 2 }
    - { id: STCraftSapphireCrystalT4, prob: 0.1, rolls: 2 }
    - { id: STCraftPolymerFabricT4, prob: 0.1, rolls: 2 }
    - { id: STCraftIndustrialThreadStaplesKitT4, prob: 0.1, rolls: 2 }

    # Crafting materials - T5
    - { id: STCraftNanoChipT5, prob: 0.1 }
    - { id: STCraftSheetSteelT5, prob: 0.1 }
    - { id: STCraftRedWoodPlankT5, prob: 0.1 }
    - { id: STCraftPlasticFittingT5, prob: 0.1 }
    - { id: STCraftAluminumOxideT5, prob: 0.1 }
    - { id: STCraftCompositeMaterialT5, prob: 0.1 }
    - { id: STCraftHighStrengthKitT5, prob: 0.1 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.05 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.4, rolls: 3 }
    - { id: STGauze, prob: 0.4, rolls: 3 }
    - { id: STOintment, prob: 0.4, rolls: 3 }
    - { id: STTourniquet, prob: 0.1 }
    - { id: antiradpill, prob: 0.1 }
    - { id: radioprotectpill, prob: 0.1 }
    - { id: psyblock, prob: 0.1 }
    - { id: MedkitAI2, prob: 0.15 }
    - { id: MedkitMilitary, prob: 0.05 }

    # Utility equipment
    - { id: GeigerCounter, prob: 0.05 }
    - { id: BaseRadio, prob: 0.05 }
    - { id: HandheldGPSBasic, prob: 0.05 }

    # Jewelry - 20% per container
    - !type:NestedSelector
      tableId: STLootJewelry
      prob: 0.20

- type: entity
  parent: STBaseTrashCache
  id: STTrashStorageFillT5
  name: мусор
  abstract: true
  suffix: ST, Cache, T5
  components:
    - type: Transform
      anchored: true
    - type: InteractionOutline
    - type: EntityTableContainerFill # ST:OW
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootTrashT5

- type: entity
  parent: [STBaseTrashCache, STTrashStorageFillT5]
  id: STTrash1CacheT5
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Decoration/trash.yml
      state: 1
    - type: SpawnOnDespawn
      prototype: STTrash1CacheT5

