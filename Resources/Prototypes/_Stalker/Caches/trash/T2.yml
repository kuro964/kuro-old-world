# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootTrashT2
  table: !type:AllSelector
    children:
    # Crafting materials - T2
    - { id: STCraftStandardPCBT2, prob: 0.1 }
    - { id: STCraftSheetIronT2, prob: 0.1 }
    - { id: STCraftBirchPlankT2, prob: 0.1 }
    - { id: STCraftPlasticFittingT2, prob: 0.1 }
    - { id: STCraftGlassT2, prob: 0.1 }
    - { id: STCraftHideT2, prob: 0.1 }
    - { id: STCraftTapeKitT2, prob: 0.1 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.02 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.25, rolls: 3 }
    - { id: STGauze, prob: 0.25, rolls: 3 }
    - { id: STOintment, prob: 0.25, rolls: 3 }
    - { id: STTourniquet, prob: 0.04 }
    - { id: antiradpill, prob: 0.04 }
    - { id: radioprotectpill, prob: 0.04 }
    - { id: psyblock, prob: 0.04 }
    - { id: MedkitAI2, prob: 0.06 }
    - { id: MedkitMilitary, prob: 0.02 }

    # Food and drink
    - { id: STDrinkJarMold, prob: 0.02 }
    - { id: STDrinkJarPiss, prob: 0.02 }
    - { id: STDrinkJarMilkSpoiled, prob: 0.02 }
    - { id: STDrinkJarSap, prob: 0.01 }
    - { id: STDrinkJar, prob: 0.01 }

    # Utility equipment
    - { id: GeigerCounter, prob: 0.02 }
    - { id: BaseRadio, prob: 0.02 }
    - { id: HandheldGPSBasic, prob: 0.02 }

    # Jewelry - 5% per container
    - !type:NestedSelector
      tableId: STLootJewelry
      prob: 0.05

- type: entity
  parent: STBaseTrashCache
  id: STTrashStorageFillT2
  name: мусор
  abstract: true
  suffix: ST, Cache, T2
  components:
    - type: Transform
      anchored: true
    - type: InteractionOutline
    - type: EntityTableContainerFill # ST:OW
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootTrashT2

- type: entity
  parent: [STBaseTrashCache, STTrashStorageFillT2]
  id: STTrash1CacheT2
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Decoration/trash.yml
      state: 1
    - type: SpawnOnDespawn
      prototype: STTrash1CacheT2

