# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootCacheT2
  table: !type:AllSelector
    children:
    # Crafting materials - T2
    - { id: STCraftStandardPCBT2, prob: 0.2 }
    - { id: STCraftSheetIronT2, prob: 0.4 }
    - { id: STCraftBirchPlankT2, prob: 0.2 }
    - { id: STCraftPlasticFittingT2, prob: 0.4 }
    - { id: STCraftGlassT2, prob: 0.4 }
    - { id: STCraftHideT2, prob: 0.2 }
    - { id: STCraftTapeKitT2, prob: 0.2 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.04 }
    - { id: STCraftBattery, prob: 0.2 }
    - { id: STCraftCoil, prob: 0.2 }
    - { id: STCraftCapacitor, prob: 0.2 }
    - { id: STCraftTransformer, prob: 0.2 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.25, rolls: 3 }
    - { id: STGauze, prob: 0.25, rolls: 3 }
    - { id: STOintment, prob: 0.25, rolls: 3 }
    - { id: STTourniquet, prob: 0.06 }
    - { id: antiradpill, prob: 0.06 }
    - { id: radioprotectpill, prob: 0.06 }
    - { id: psyblock, prob: 0.06 }
    - { id: MedkitAI2, prob: 0.1 }
    - { id: MedkitMilitary, prob: 0.04 }
    - { id: MedkitScience, prob: 0.01 }

    # Food and drink
    - { id: STCookingKebabMeat, prob: 0.05 }
    - { id: STCookingKebabVeggie, prob: 0.05 }
    - { id: STCookingMeatStew, prob: 0.05 }
    - { id: STCookingCabbageSoup, prob: 0.05 }
    - { id: STCookingBorscht, prob: 0.05 }
    - { id: STDrinkJarDirtyWater, prob: 0.08 }
    - { id: STDrinkJarBlood, prob: 0.01 }
    - { id: STDrinkJar, prob: 0.03 }
    - { id: STDrinkJarMoonshine, prob: 0.01 }
    - { id: STCookingPickledEggs, prob: 0.02 }
    - { id: STCookingKvass, prob: 0.02 }

    # Utility equipment
    - { id: GeigerCounter, prob: 0.03 }
    - { id: BaseRadio, prob: 0.03 }
    - { id: HandheldGPSBasic, prob: 0.03 }
    - { id: BoxArtcontDamaged, prob: 0.02 }
    - { id: STFlashlightSeclite, prob: 0.03 }
    - { id: STHeadLight, prob: 0.03 }
    - { id: PowerCellHyper, prob: 0.06 }
    - { id: CheapLighter, prob: 0.04 }
    - { id: CraftLeatherbox, prob: 0.001 }

    # Weapons and explosives
    - { id: RGD5Grenade, prob: 0.05 }

    # Blueprints
    - { id: ST6mmBuckshotBoxCinkBluePrint, prob: 0.05 }
    - { id: ST8mmBuckshotBoxCinkBlueprint, prob: 0.03 }
    - { id: ST45ACPLFMJBoxCinkBlueprint, prob: 0.05 }
    - { id: ST545FMJBoxCinkBlueprint, prob: 0.05 }
    - { id: ST918PSTBoxCinkBlueprint, prob: 0.05 }
    - { id: ST919PSTBoxCinkBlueprint, prob: 0.05 }
    - { id: ST754HPBoxCinkBlueprint, prob: 0.03 }
    - { id: ST556FMJBoxCinkBlueprint, prob: 0.05 }
    - { id: ST725PTBoxCinkBlueprint, prob: 0.05 }
    - { id: ST45ACPRIPBoxCinkBlueprint, prob: 0.05 }
    - { id: ST751UNBoxCinkBlueprint, prob: 0.05 }
    - { id: ST739HPBoxCinkBlueprint, prob: 0.05 }
    - { id: ClothingOuterArmorZaryaHunterBlueprint, prob: 0.05 }
    - { id: STClothingOuterArmor6B2Blueprint, prob: 0.05 }
    - { id: STClothingOuterArmorLightPlateVestBaseStalkerBlueprint, prob: 0.05 }
    - { id: ClothingOuterArmourJacketStalkerBlueprint, prob: 0.05 }
    - { id: STZoneArtifactDetectorResponseBlueprint, prob: 0.05 }
    - { id: ClothingOuterCoatSmugglerBlueprint, prob: 0.05 }
    - { id: MakeshiftArtContBlueprint, prob: 0.05 }

    # Jewelry - 10% per container
    - !type:NestedSelector
      tableId: STLootJewelry
      prob: 0.10

- type: entity
  parent: STBaseCache
  id: STCacheStorageFillT2
  abstract: true
  suffix: ST, Cache, T2
  name: old crate # ST:OW
  description: A crate coated in dust and rust. It might be worth searching; there could still be something useful inside. # ST:OW
  #  name: ящик
  #  description: Довольно таки старый ящик. Возможно, стоит его обыскать. Может, можно найти что-то полезное в нём.
  components:
    - type: InteractionOutline
    - type: EntityTableContainerFill # ST:OW
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootCacheT2

- type: entity
  parent: [ STCacheStorageFillT2, STBaseCache]
  id: STCache1T2
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/black_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache1T2

- type: entity
  parent: [ STCacheStorageFillT2, STBaseCache]
  id: STCache2T2
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/blue_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache2T2

- type: entity
  parent: [ STCacheStorageFillT2, STBaseCache]
  id: STCache3T2
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/green_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache3T2
