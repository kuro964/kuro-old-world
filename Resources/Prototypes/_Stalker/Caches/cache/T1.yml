# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootCacheT1
  table: !type:AllSelector
    children:
    # Crafting materials - T1
    - { id: STCraftSheetCopperT1, prob: 0.3 }
    - { id: STCraftPinePlankT1, prob: 0.3 }
    - { id: STCraftCottonFabricT1, prob: 0.3 }
    - { id: STCraftBasicThreadKitT1, prob: 0.3 }

    # Crafting materials - T2
    - { id: STCraftGlassT2, prob: 0.001 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.02 }
    - { id: STCraftBattery, prob: 0.02 }
    - { id: STCraftCoil, prob: 0.02 }
    - { id: STCraftCapacitor, prob: 0.02 }
    - { id: STCraftTransformer, prob: 0.02 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.2 }
    - { id: STGauze, prob: 0.2 }
    - { id: STOintment, prob: 0.2, rolls: 3 }
    - { id: STTourniquet, prob: 0.03 }
    - { id: antiradpill, prob: 0.03 }
    - { id: radioprotectpill, prob: 0.03 }
    - { id: psyblock, prob: 0.03 }
    - { id: MedkitAI2, prob: 0.05 }
    - { id: MedkitMilitary, prob: 0.02 }
    - { id: MedkitScience, prob: 0.005 }

    # Food and drink
    - { id: STCookingDeruny, prob: 0.05 }
    - { id: STCookingHrechanyky, prob: 0.05 }
    - { id: STCookingSyrnyky, prob: 0.05 }
    - { id: STDrinkJarDirtyWater, prob: 0.1 }
    - { id: STDrinkJarBlood, prob: 0.01 }
    - { id: STDrinkJar, prob: 0.03 }

    # Utility equipment
    - { id: GeigerCounter, prob: 0.015 }
    - { id: BaseRadio, prob: 0.015 }
    - { id: HandheldGPSBasic, prob: 0.015 }
    - { id: BoxArtcontDamaged, prob: 0.01 }
    - { id: STFlashlightSeclite, prob: 0.015 }
    - { id: STHeadLight, prob: 0.015 }
    - { id: PowerCellHyper, prob: 0.03 }

    # Blueprints
    - { id: STClothingOuterJacketStalkerUpgradeBlueprint, prob: 0.05 }
    - { id: STClothingOuterArmorRCBZBlueprint, prob: 0.05 }
    - { id: ST7mmBuckshotBoxCinkBluePrint, prob: 0.05 }
    - { id: ST6mmBuckshotBoxCinkBluePrint, prob: 0.02 }
    - { id: ST45ACPLFMJBoxCinkBlueprint, prob: 0.02 }
    - { id: ST918PGJBoxCinkBlueprint, prob: 0.05 }
    - { id: ST918SP7BoxCinkBlueprint, prob: 0.05 }
    - { id: ST545HPBoxCinkBlueprint, prob: 0.05 }
    - { id: ST919PSOGJBoxCinkBlueprint, prob: 0.05 }
    - { id: ST919RIPBoxCinkBlueprint, prob: 0.05 }
    - { id: ST754HPBoxCinkBlueprint, prob: 0.01 }
    - { id: ST556WarmagBoxCinkBlueprint, prob: 0.05 }
    - { id: ST725PBoxCinkBlueprint, prob: 0.05 }
    - { id: ST725LRNPCBoxCinkBlueprint, prob: 0.05 }
    - { id: STZoneArtifactDetectorBushBlueprint, prob: 0.05 }
    - { id: ST739HPBoxCinkBlueprint, prob: 0.03 }
    - { id: ST751UNBoxCinkBlueprint, prob: 0.02 }
    - { id: ST45ACPRIPBoxCinkBlueprint, prob: 0.02 }
    - { id: ClothingHeadHatSmugglerBlueprint, prob: 0.05 }

    # Jewelry - 5% per container
    - !type:NestedSelector
      tableId: STLootJewelry
      prob: 0.05
# ST:OW end
- type: entity
  parent: STBaseCache
  id: STCacheStorageFillT1
  abstract: true
  suffix: ST, Cache, T1
  name: old crate # ST:OW
  description: A crate coated in dust and rust. It might be worth searching; there could still be something useful inside. # ST:OW
  #  name: ящик
  #  description: Довольно таки старый ящик. Возможно, стоит его обыскать. Может, можно найти что-то полезное в нём.
  components:
    - type: InteractionOutline
    - type: EntityTableContainerFill # ST:OW
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootCacheT1

- type: entity
  parent: [ STCacheStorageFillT1, STBaseCache]
  id: STCache1T1
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/black_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache1T1

- type: entity
  parent: [ STCacheStorageFillT1, STBaseCache]
  id: STCache2T1
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/blue_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache2T1

- type: entity
  parent: [ STCacheStorageFillT1, STBaseCache]
  id: STCache3T1
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/green_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache3T1
