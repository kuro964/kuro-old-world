      sprite: _Stalker/Objects/Other/Boxes/blue_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache2T3

- type: entity
  parent: [ STCacheStorageFillT3, STBaseCache]
  id: STCache3T3
