# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootCacheT3
  table: !type:AllSelector
    children:
    # Crafting materials - T3
    - { id: STCraftMultilayerPCBT3, prob: 0.3 }
    - { id: STCraftPlasticFittingT3, prob: 0.3 }
    - { id: STCraftQuartzCrystalT3, prob: 0.3 }
    - { id: STCraftSturdyHideT3, prob: 0.4 }
    - { id: STCraftGlueKitT3, prob: 0.3 }
    - { id: STCraftSheetBrassT3, prob: 0.4 }
    - { id: STOWCraftBallisticPlateT3, prob: 0.1 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.3 }
    - { id: STCraftBattery, prob: 0.15 }
    - { id: STCraftCoil, prob: 0.15 }
    - { id: STCraftCapacitor, prob: 0.15 }
    - { id: STCraftTransformer, prob: 0.15 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.3, rolls: 3 }
    - { id: STGauze, prob: 0.3, rolls: 3 }
    - { id: STOintment, prob: 0.3, rolls: 3 }
    - { id: STTourniquet, prob: 0.09 }
    - { id: antiradpill, prob: 0.09 }
    - { id: radioprotectpill, prob: 0.09 }
    - { id: psyblock, prob: 0.09 }
    - { id: MedkitAI2, prob: 0.15 }
    - { id: MedkitMilitary, prob: 0.06 }
    - { id: MedkitScience, prob: 0.015 }

    # Food and drink
    - { id: STCookingSnorkSoup, prob: 0.05 }
    - { id: STDrinkJarDirtyWater, prob: 0.08 }
    - { id: STDrinkJarBlood, prob: 0.02 }
    - { id: STDrinkJar, prob: 0.03 }
    - { id: STDrinkJarMoonshine, prob: 0.01 }
    - { id: STDrinkJarSap, prob: 0.01 }
    - { id: STDrinkJarJuicePotato, prob: 0.01 }
    - { id: STCookingFermentedEel, prob: 0.02 }
    - { id: STCookingKvass, prob: 0.04 }

    # Utility equipment
    - { id: BoxArtcontDamaged, prob: 0.03 }
    - { id: CraftLeatherbox, prob: 0.002 }
    - { id: ToolkitTearOne, prob: 0.001 }

    # Weapons and explosives
    - { id: RGD5Grenade, prob: 0.1 }

    # Blueprints
    - { id: ST8mmBuckshotBoxCinkBlueprint, prob: 0.05 }
    - { id: STShotgunFlechetteCinkBlueprint, prob: 0.03 }
    - { id: ST545PCBoxCinkBlueprint, prob: 0.05 }
    - { id: ST918PBMBoxCinkBlueprint, prob: 0.05 }
    - { id: ST919PBMBoxCinkBlueprint, prob: 0.05 }
    - { id: ST754FMJBoxCinkBlueprint, prob: 0.03 }
    - { id: ST556M855BoxCinkBlueprint, prob: 0.05 }
    - { id: ST725PSTBoxCinkBlueprint, prob: 0.05 }
    - { id: ST739FMJBoxCinkBlueprint, prob: 0.05 }
    - { id: ST751M80BoxCinkBlueprint, prob: 0.05 }
    - { id: ST45ACPAPBoxCinkBlueprint, prob: 0.05 }
    - { id: STClothingOuterArmorLightPlateVestBasePSZ7Blueprint, prob: 0.03 }
    - { id: ClothingOuterArmorSevaStalkerBlueprint, prob: 0.03 }
    - { id: STClothingOuterArmorLightPlateVestBaseANAgrayBlueprint, prob: 0.03 }
    - { id: ClothingOuterArmorStalkerBlueprint, prob: 0.03 }
    - { id: ClothingHeadAssaultHelmetBlueprint, prob: 0.03 }
    - { id: ClothingHeadHelmetVityaz1CBlueprint, prob: 0.03 }
    - { id: STZoneArtifactDetectorSpruceBlueprint, prob: 0.02 }
    - { id: ClothingBeltSmugglerBlueprint, prob: 0.05 }
    - { id: ClothingBackpackSmugglerBlueprint, prob: 0.03 }
    - { id: MakeshiftArtContBlueprint, prob: 0.03 }

- type: entity
  parent: STBaseCache
  id: STCacheStorageFillT3
  abstract: true
  suffix: ST, Cache, T3
  name: old crate # ST:OW
  description: A crate coated in dust and rust. It might be worth searching; there could still be something useful inside. # ST:OW
  #  name: ящик
  #  description: Довольно таки старый ящик. Возможно, стоит его обыскать. Может, можно найти что-то полезное в нём.
  components:
    - type: InteractionOutline # ST:OW
    - type: EntityTableContainerFill
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootCacheT3

- type: entity
  parent: [ STCacheStorageFillT3, STBaseCache]
  id: STCache1T3
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/black_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache1T3

- type: entity
  parent: [ STCacheStorageFillT3, STBaseCache]
  id: STCache2T3
  categories: [ HideSpawnMenu ]
  components:
