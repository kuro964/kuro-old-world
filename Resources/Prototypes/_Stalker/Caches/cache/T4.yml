# ST:OW - Loot table at the top & containers below that
# Each item rolls independently & rolls repeat the chance for it to spawn, not item amount
- type: entityTable
  id: STLootCacheT4
  table: !type:AllSelector
    children:
    # Crafting materials - T3
    - { id: STCraftMultilayerPCBT3, prob: 0.3 }
    - { id: STCraftMultilayerPCBT3, prob: 0.2 }
    - { id: STCraftQuartzCrystalT3, prob: 0.5 }
    - { id: STCraftQuartzCrystalT3, prob: 0.2 }
    - { id: STCraftSturdyHideT3, prob: 0.5 }
    - { id: STCraftSturdyHideT3, prob: 0.2 }
    - { id: STCraftGlueKitT3, prob: 0.5 }
    - { id: STCraftGlueKitT3, prob: 0.2 }
    - { id: STCraftPlasticFittingT3, prob: 0.4 }
    - { id: STCraftSheetBrassT3, prob: 0.5 }
    - { id: STOWCraftBallisticPlateT3, prob: 0.2 }

    # Crafting materials - T4
    - { id: STCraftHighPerformanceChipT4, prob: 0.2 }
    - { id: STCraftSheetAluminumT4, prob: 0.2 }
    - { id: STCraftPlasticFittingT4, prob: 0.2 }
    - { id: STCraftPolymerFabricT4, prob: 0.2 }
    - { id: STCraftIndustrialThreadStaplesKitT4, prob: 0.2 }

    # Electronics and gunpowder
    - { id: CraftMaterialGunpowder, prob: 0.3 }
    - { id: STCraftBattery, prob: 0.02 }
    - { id: STCraftCoil, prob: 0.02 }
    - { id: STCraftCapacitor, prob: 0.02 }
    - { id: STCraftTransformer, prob: 0.02 }

    # Medical supplies
    - { id: STBrutepack, prob: 0.35, rolls: 3 }
    - { id: STGauze, prob: 0.35, rolls: 3 }
    - { id: STOintment, prob: 0.35, rolls: 3 }
    - { id: STTourniquet, prob: 0.12 }
    - { id: antiradpill, prob: 0.12 }
    - { id: radioprotectpill, prob: 0.12 }
    - { id: psyblock, prob: 0.12 }
    - { id: MedkitMilitary, prob: 0.08 }
    - { id: MedkitScience, prob: 0.02 }

    # Food and drink
    - { id: STDrinkJarDirtyWater, prob: 0.08 }
    - { id: STDrinkJarBlood, prob: 0.05 }
    - { id: STDrinkJar, prob: 0.03 }
    - { id: STDrinkJarMoonshine, prob: 0.03 }
    - { id: STDrinkJarSap, prob: 0.01 }
    - { id: STDrinkJarJuicePotato, prob: 0.01 }
    - { id: STCookingFermentedEel, prob: 0.08 }

    # Utility equipment
    - { id: BoxArtcont, prob: 0.04 }
    - { id: CraftLeatherbox, prob: 0.003 }
    - { id: ToolkitTearOne, prob: 0.002 }
    - { id: ToolkitTearTwo, prob: 0.001 }

    # Weapons and explosives
    - { id: RGD5Grenade, prob: 0.1, rolls: 3 }

- type: entity
  parent: STBaseCache
  id: STCacheStorageFillT4
  abstract: true
  suffix: ST, Cache, T4
  name: old crate # ST:OW
  description: A crate coated in dust and rust. It might be worth searching; there could still be something useful inside. # ST:OW
  #  name: ящик
  #  description: Довольно таки старый ящик. Возможно, стоит его обыскать. Может, можно найти что-то полезное в нём.
  components:
    - type: InteractionOutline
    - type: EntityTableContainerFill # ST:OW
      containers:
        storagebase: !type:NestedSelector
          tableId: STLootCacheT4

- type: entity
  parent: [ STCacheStorageFillT4, STBaseCache]
  id: STCache1T4
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/black_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache1T4

- type: entity
  parent: [ STCacheStorageFillT4, STBaseCache]
  id: STCache2T4
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/blue_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache2T4

- type: entity
  parent: [ STCacheStorageFillT4, STBaseCache]
  id: STCache3T4
  categories: [ HideSpawnMenu ]
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/green_crate.rsi
      state: icon
    - type: SpawnOnDespawn
      prototype: STCache3T4

