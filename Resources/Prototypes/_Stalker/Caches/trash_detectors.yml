# ST:OW - One item drops from each category on a successful roll
# Rolls in sequential order: Legendary > Epic > Rare > Common
- type: entity
  id: RandomTrashDetectorSpawner
  #name: спавнер случайного мусора (металлоискатель) # ST:OW
  name: random garbage spawner (metal detector) # ST:OW
  suffix: Stalker
  parent: FlexibleMarker
  components:
    - type: Sprite
      sprite: _Stalker/Objects/Other/Boxes/green_crate.rsi
      state: icon
    - type: RandomSpawner
      prototypes:
      # T1 materials
      - STCraftSheetCopperT1
      - STCraftPlasticFittingT1
      - STCraftPinePlankT1
      - STCraftGlassT1
      - STCraftCottonFabricT1
      - STCraftBasicThreadKitT1
      - STCraftBasicPCBT1
      # T2 materials
      - STCraftSheetIronT2
      - STCraftPlasticFittingT2
      - STCraftBirchPlankT2
      - STCraftGlassT2
      - STCraftHideT2
      - STCraftTapeKitT2
      - STCraftStandardPCBT2
      # Electronics
      - STCraftBattery
      - STCraftCoil
      - STCraftCapacitor
      - STCraftTransformer
      # Utility
      - MedkitAI2
      # Cheap finds
      - TreasureCoinIron
      - TreasureCoinSilver
      - TreasureCoinGold
      - Wristwatch
      # Currency
      - Roubles100

      # Rare
      rarePrototypes:
      # T3 materials
      - STCraftSheetBrassT3
      - STCraftSturdyHideT3
      # Weapons and explosives
      - STWeaponShotgunMossbergM88
      - WeaponPistolStalkerAPS
      - KhattabkaGrenade
      - STWeaponRifleAKS74U
      - STWeaponRifleSaiga545
      - STWeaponSniperMosin
      - STWeaponSniperSKS
      # Medical supplies
      - MedkitMilitary
      - MedkitScience
      # Valuables
      - IngotSilver1
      - STJewelrySilver
      # Currency
      - Roubles500
      rareChance: 0.05 # 4.97502% after  higher tiers fail

      # Epic
      epicPrototypes:
      - STJewelryGold
      - IngotGold1
      - MaterialDiamond1
      epicChance: 0.004 # 0.3996% after Legendary fails

      # Legendary
      legendaryPrototypes:
      - STWristwatchGold
      - STGoldRingBigDiamond
      legendaryChance: 0.001 # 0.1%

- type: entity
  parent: BaseItem
  id: TrashDetectorTier1
  # ST:OW begin
  #name: металлоискатель "Простофиля"
  #description: Сделан из говна и палок, но если порыться им в больших кучах мусора, то возможно вы что-то найдете.
  #suffix: Stalker, металлоискатель
  name: metal detector "Prostofil"
  description: Made of junk and sticks, but if you rummage through large piles of garbage, you might find something.
  suffix: Stalker, metal detector
  components:
    - type: RepositoryItem # ST:OW
      categoryName: repository-detectors-category
    - type: STWeight
      self: 6
    - type: Item
      size: Large
      shape:
        - 0,0,1,1
    - type: Sprite
      sprite: _Stalker/Objects/Tools/Trash_detectors/T1_trash_detector.rsi
      state: icon
    - type: TrashDetector
      searchTime: 30
      probability: 0.30
      # ST:OW end

