- type: entity
  parent: BaseAmmoBoxStalker
  id: 2375ShrapnelBuckshotBox
  name: Box of buckshot 'Shrapnel 25' 23x75mm R
  description: For the KS-23, there are 10 pieces in a box. Can penetrate class 1 armor.
  components:
  - type: MagazineVisuals
    magState: 1270red
  - type: BallisticAmmoProvider
    capacity: 10
    proto: CartridgeShrapnel25Buckshot
    whitelist:
      tags:
        - ShellKS23
  - type: Sprite
    layers:
    - state: 1270
      map: ["enum.GunVisualLayers.Base"]
    - state: 1270red-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: 7mmBuckshotBox
  id: 2375BarricadaBulletBox
  name: Box of 'Barricade' 23x75mm R bullets
  description: For the KS-23, comes in a box of 10. Can penetrate class 3 armor.
  components:
  - type: MagazineVisuals
    magState: 1270gray
  - type: BallisticAmmoProvider
    proto: CartridgeShotgunBarricadaBullet
  - type: Sprite
    layers:
    - state: 1270solid
      map: ["enum.GunVisualLayers.Base"]
    - state: 1270gray-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: 7mmBuckshotBox
  id: 2375VolnaRBulletBox
  name: Box of 'WaveR' 23x75mm R bullets
  description: For the KS-23, there are 10 rounds in a box. Useless against armor, but it can fold an enemy in half without dealing much damage.
  components:
  - type: MagazineVisuals
    magState: 1270gray
  - type: BallisticAmmoProvider
    proto: CartridgeShotgunVolnaRBullet
  - type: Sprite
    layers:
    - state: 1270solid
      map: ["enum.GunVisualLayers.Base"]
    - state: 1270gray-1
      map: ["enum.GunVisualLayers.Mag"]

