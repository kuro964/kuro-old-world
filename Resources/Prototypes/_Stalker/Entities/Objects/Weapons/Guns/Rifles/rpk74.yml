- type: entity
  parent: STBaseWeaponRifleAKS74
  id: STWeaponRifleRPK74
  name: RPK-74
  description: The Kalashnikov light machine gun based on the AK-74.
  components:
  - type: STWeight
    self: 5.5
  - type: GunWieldBonus
    minAngle: -45
    maxAngle: -55
  - type: GunRequiresWield
  - type: PullDoAfter
    pullTime: 4
  - type: UseDelay
    delay: 1
  - type: Gun
    minAngle: 50
    maxAngle: 100
    angleIncrease: 1
    angleDecay: 8
    projectileSpeed: 60
    fireRate: 8
  - type: HeldSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.5
  - type: Clothing
    sprite: _Stalker/Objects/Weapons/Guns/Rifles/inhands/RPK-74mag.rsi
  - type: Item
    sprite: _Stalker/Objects/Weapons/Guns/Rifles/inhands/RPK-74mag.rsi
