- type: entity
  parent: STClothingCapeT2Base
  id: ClothingOuterCoatStalkerBloody
  name: Stalker's Bloody Coat
  suffix: ST, T2, Reward, Halloween
  description: A standard leather coat often seen in the zone. The edges are frayed and grime clings to it; fresh blood is spattered across it.
  components:
  - type: STWeight
    self: 1.5
  - type: Sprite
    sprite: _Stalker_EN/Objects/Clothing/cloak/coat_stalker_bloody.rsi
  - type: Clothing
    sprite: _Stalker_EN/Objects/Clothing/cloak/coat_stalker_bloody.rsi
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodCoatStalker

