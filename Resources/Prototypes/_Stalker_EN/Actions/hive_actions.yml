- type: entity
  parent: BaseAction
  id: ActionSTHiveCall
  name: Call the Faithful
  description: Call nearby Monolith soldiers to follow you, or bring your held soldiers back to your side.
  components:
  - type: Action
    icon:
      sprite: _Stalker/Interface/Actions/psyonics.rsi
      state: grab
    useDelay: 2
  - type: InstantAction
    event: !type:STHiveCallActionEvent

- type: entity
  parent: BaseAction
  id: ActionSTHiveHold
  name: Hold Position
  description: Your soldiers stay where they stand and fight from there.
  components:
  - type: Action
    icon:
      sprite: _Stalker/Interface/Actions/psyonics.rsi
      state: meditation
    useDelay: 2
  - type: InstantAction
    event: !type:STHiveHoldActionEvent

- type: entity
  parent: BaseAction
  id: ActionSTHiveRelease
  name: Release the Faithful
  description: Your soldiers return to their posts.
  components:
  - type: Action
    icon:
      sprite: _Stalker/Interface/Actions/psyonics.rsi
      state: rift
    useDelay: 2
  - type: InstantAction
    event: !type:STHiveReleaseActionEvent

- type: entity
  parent: BaseAction
  id: ActionSTHiveRecruit
  name: Claim a Soldier
  description: Pick one Monolith soldier to follow you. Pick one of your own to send it back to its post.
  components:
  - type: Action
    icon:
      sprite: _Stalker/Interface/Actions/psyonics.rsi
      state: light
    iconOn:
      sprite: _Stalker_EN/Interface/Actions/hive_claim.rsi
      state: light_on
    useDelay: 0.5
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:STHiveRecruitActionEvent
