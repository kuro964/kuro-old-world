    # ST:OW begin
    - type: STWeight
      self: 0.6
    # ST:OW end
    - type: FlavorProfile
      flavors:
        - meaty
    - type: Edible
      trash:
      - FoodBowlBig
      utensil:
        - Spoon
        - Fork
